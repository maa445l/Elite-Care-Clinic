name: Build and publish the Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install tools
        run: npm install --no-audit --no-fund

      - name: Set the version and your repository name
        env:
          RELEASE_VERSION: 1.0.${{ github.run_number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: node scripts/set-release.js

      - name: Build the installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --publish never

      - name: Show what was built
        run: Get-ChildItem dist | Select-Object Name, Length

      - name: Keep a copy of the installer on this page
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*.exe
          retention-days: 30

      - name: Publish the release (this is what makes update notices work)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -like "*.exe" -or $_.Name -like "*.blockmap" -or $_.Name -eq "latest.yml" } | ForEach-Object { $_.FullName }
          Write-Host "Uploading:" $files
          gh release create "v1.0.${{ github.run_number }}" $files --title "Version 1.0.${{ github.run_number }}" --notes "Automatic build of Elite Care Clinic" --latest
